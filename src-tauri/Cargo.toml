[package]
name = "quicktranslate"
version = "0.8.0"
edition = "2021"

[lib]
name = "quicktranslate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 2.12 起 tauri-utils 才有 LiquidGlass 材质变体（macOS 26+）。
# 下限锁到 2.12：2.10/2.11 的 Effect 枚举里没有这两个变体，编译不过。
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
# URL 解析：open_url 的 scheme 白名单校验基于标准 URL parser，
# 不再手写 split("://")（QT-004）。reqwest 已依赖同一 crate。
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# 本地时区日界计算（history::get_stats 的 daily_7d）。
# 已在依赖树中（传递依赖），显式声明并开启 local-offset。
time = { version = "0.3", features = ["local-offset"] }

thiserror = "2"
async-trait = "0.1"

arboard = "3"

aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"

# 签名依赖（腾讯/有道 HMAC-SHA256，百度 MD5）
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    # GetClipboardSequenceNumber：区分"同一段文本被重新复制"与"文本原地未动"
    "Win32_System_DataExchange",
    # DwmSetWindowAttribute + DWMWA_USE_IMMERSIVE_DARK_MODE：
    # set_popup_theme 让 DWM 系统材质明暗跟随应用主题（非系统主题）
    "Win32_Graphics_Dwm",
] }

# macOS：浮窗被动态的自动关闭需要查询前台应用（popup_watch 的
# foreground_window）；set_popup_theme 需要把浮窗的 NSWindow appearance
# 切到与 CSS 一致的明暗（NSWindow::setAppearance）。
#
# NSWindow 的 NSAppearanceCustomization 实现同时门控在 NSAppearance 与
# NSResponder 两个 feature 上（NSWindow 自身以 NSResponder 为父类），
# 少一个都不会生成 trait impl，调用 setAppearance 编译不过。
#
# NSPasteboard 为剪贴板监控提供 changeCount（剪贴板变化代数）：没有它，
# macOS 上「关闭浮窗后同文本是否被用户重新复制」无从判定（QT-002）。
#
# core-graphics 为浮窗定位提供真实光标坐标（CGEventGetLocation）与显示器
# 几何（CGDisplayBounds / CGDisplayMode pixel width），全部线程安全，可在
# 剪贴板 worker 线程直接调用 —— NSScreen 需要 MainThreadMarker，worker
# 线程拿不到（QT-001）。tao 已依赖同一 crate（0.25），不新增依赖树。
#
# 这几项都在 objc2-app-kit 0.3.2 的 `default` 里，显式列出是冗余的；
# 保留的原因是把「本 crate 实际用到哪些 AppKit 能力」写进清单 —— 将来
# 若关闭 default-features 精简编译，这里就是必须补齐的列表。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace",
    "NSRunningApplication",
    "NSWindow",
    "NSAppearance",
    "NSResponder",
    "NSPasteboard",
] }
core-graphics = "0.25"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"
panic = "abort"
