[package]
name = "quicktranslate"
version = "0.7.0"
edition = "2021"

[lib]
name = "quicktranslate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 2.12 起 tauri-utils 才有 LiquidGlass 材质变体（macOS 26+）。
# 下限锁到 2.12：2.10/2.11 的 Effect 枚举里没有这两个变体，编译不过。
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# 本地时区日界计算（history::get_stats 的 daily_7d）。
# 已在依赖树中（传递依赖），显式声明并开启 local-offset。
time = { version = "0.3", features = ["local-offset"] }

thiserror = "2"
async-trait = "0.1"

arboard = "3"

aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"

# 签名依赖（腾讯/有道 HMAC-SHA256，百度 MD5）
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    # GetClipboardSequenceNumber：区分"同一段文本被重新复制"与"文本原地未动"
    "Win32_System_DataExchange",
    # DwmSetWindowAttribute + DWMWA_USE_IMMERSIVE_DARK_MODE：
    # set_popup_theme 让 DWM 系统材质明暗跟随应用主题（非系统主题）
    "Win32_Graphics_Dwm",
] }

# macOS：浮窗被动态的自动关闭需要查询前台应用（popup_watch 的
# foreground_window）。objc2 只保留 AppKit（NSWorkspace）最小面
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"
panic = "abort"
