# .github/workflows/ci.yml
# 持续集成：在 push 到 main 和 PR 到 main 时运行。
# 包含前端类型检查与构建、Rust 格式检查与 lint、以及 Tauri 构建验证。
#
# 本项目支持 Windows 与 macOS 双平台。
# 与 release.yml 的分工：
#   - ci.yml：快速反馈，验证代码质量与可构建性（无产物发布）
#   - release.yml：仅在 v* tag 触发，构建签名安装包并发布到 GitHub Releases

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支/PR 的新推送自动取消旧运行，节省 CI 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 前端检查 ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (type-check + build)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

  # ── Rust 格式检查 ─────────────────────────────────────────────────────────
  # cargo fmt --check 是纯格式检查，不需要编译，任何平台都能秒级完成。
  rust-fmt:
    name: Rust fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

  # ── Rust lint ─────────────────────────────────────────────────────────────
  # cargo clippy 需要完整编译。本项目支持 Windows 与 macOS 双平台，
  # 因此 clippy 在两个目标平台上各跑一次，确保平台特定代码路径都能通过。
  rust-clippy:
    name: Rust clippy (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ matrix.os }}-clippy-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-clippy-${{ matrix.target }}-

      - name: Clippy lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} -- -D warnings

  # ── 构建验证 ─────────────────────────────────────────────────────────────
  build-verify:
    name: Build verification (${{ matrix.target }})
    # 仅在 push 到 main 时运行完整构建验证，PR 只做快速检查以节省资源
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ matrix.os }}-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-build-${{ matrix.target }}-

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify version sync
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAURI_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VER=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "package.json: $PKG_VER | tauri.conf.json: $TAURI_VER | Cargo.toml: $CARGO_VER"
          if [ "$PKG_VER" != "$TAURI_VER" ] || [ "$PKG_VER" != "$CARGO_VER" ]; then
            echo "ERROR: Version mismatch — all three files must agree"
            exit 1
          fi

      - name: Build Tauri app (verify only)
        run: cd src-tauri && cargo build --release --target ${{ matrix.target }}
