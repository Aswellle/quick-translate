# .github/workflows/release.yml
# 推送 v* tag 时自动构建 Windows 与 macOS 安装包，发布到 GitHub Releases。
#
# 双平台矩阵构建：Windows (MSI) + macOS (app + dmg)。
# latest.json（Tauri Updater 自动更新清单）由 tauri-action 自动生成并上传。

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Windows 构建 ─────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    name: Build Windows (x86_64)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: windows-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-x86_64-cargo-

      - name: Install frontend dependencies
        run: npm ci

      # ── 构建前检查：三处版本号必须一致 ─────────────────────────────────
      - name: Verify version sync
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAURI_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VER=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VER | tauri.conf.json: $TAURI_VER | Cargo.toml: $CARGO_VER | tag: $TAG_VER"
          if [ "$PKG_VER" != "$TAURI_VER" ] || [ "$PKG_VER" != "$CARGO_VER" ] || [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "ERROR: Version mismatch — all three files and the git tag must agree"
            exit 1
          fi

      # ── 构建前检查：TypeScript 类型检查 ────────────────────────────────
      - name: TypeScript type check
        run: npx tsc --noEmit

      # ── 构建前检查：Rust lint ───────────────────────────────────────────
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      # ── 依赖安全扫描 ────────────────────────────────────────────────────
      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
      # ── 预装 WiX 4（MSI 打包工具）────────────────────────────────────────
      # Tauri bundler 在运行时从 GitHub 下载 WiX，会因网络 504 失败；
      # 提前安装后 bundler 直接使用本地工具链，避免 CI 网络超时。
      - name: Install WiX toolset
        run: dotnet tool install --global wix

      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "QuickTranslate ${{ github.ref_name }}"
          releaseBody: |
            ## QuickTranslate ${{ github.ref_name }}

            ### 下载
            - **Windows**：下载 `.msi` 安装包
            - **macOS**：下载 `.dmg` 安装包（Apple Silicon）

            ### 更新内容
            请查看 [Releases 页面](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}) 了解详细变更。
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

  # ── macOS 构建 ───────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    name: Build macOS (Apple Silicon)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: macos-aarch64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-aarch64-cargo-

      - name: Install frontend dependencies
        run: npm ci

      # ── 构建前检查：三处版本号必须一致 ─────────────────────────────────
      - name: Verify version sync
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAURI_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VER=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VER | tauri.conf.json: $TAURI_VER | Cargo.toml: $CARGO_VER | tag: $TAG_VER"
          if [ "$PKG_VER" != "$TAURI_VER" ] || [ "$PKG_VER" != "$CARGO_VER" ] || [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "ERROR: Version mismatch — all three files and the git tag must agree"
            exit 1
          fi

      # ── 构建前检查：TypeScript 类型检查 ────────────────────────────────
      - name: TypeScript type check
        run: npx tsc --noEmit

      # ── 构建前检查：Rust lint ───────────────────────────────────────────
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin -- -D warnings

      # ── 依赖安全扫描 ────────────────────────────────────────────────────
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build Tauri app (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "QuickTranslate ${{ github.ref_name }}"
          releaseBody: |
            ## QuickTranslate ${{ github.ref_name }}

            ### 下载
            - **Windows**：下载 `.msi` 安装包
            - **macOS**：下载 `.dmg` 安装包（Apple Silicon）

            ### 更新内容
            请查看 [Releases 页面](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}) 了解详细变更。
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin
