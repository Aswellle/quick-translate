# .github/workflows/release.yml
# 推送 v* tag 时自动构建 Windows 安装包，发布到 GitHub Releases。
#
# latest.json（Tauri Updater 自动更新清单）由 tauri-action 依据
# tauri.conf.json 的 createUpdaterArtifacts 自动生成并上传，本文件无需干预。

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build (Windows x86_64)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: windows-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-x86_64-cargo-

      - name: Install frontend dependencies
        run: npm ci

      # ── 构建前检查：三处版本号必须一致 ─────────────────────────────────
      - name: Verify version sync
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAURI_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VER=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VER | tauri.conf.json: $TAURI_VER | Cargo.toml: $CARGO_VER | tag: $TAG_VER"
          if [ "$PKG_VER" != "$TAURI_VER" ] || [ "$PKG_VER" != "$CARGO_VER" ] || [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "ERROR: Version mismatch — all three files and the git tag must agree"
            exit 1
          fi

      # ── 构建前检查：TypeScript 类型检查 ────────────────────────────────
      - name: TypeScript type check
        run: npx tsc --noEmit

      # ── 构建前检查：Rust lint ───────────────────────────────────────────
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      # ── 依赖安全扫描 ────────────────────────────────────────────────────
      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: false

      # ── 预装 WiX 4（MSI 打包工具）────────────────────────────────────────
      # Tauri bundler 在运行时从 GitHub 下载 WiX，会因网络 504 失败；
      # 提前安装后 bundler 直接使用本地工具链，避免 CI 网络超时。
      - name: Install WiX toolset
        run: dotnet tool install --global wix

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 若签名私钥无密码，此 secret 设为空字符串即可；有密码则填入密码
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "QuickTranslate ${{ github.ref_name }}"
          releaseBody: |
            ## QuickTranslate ${{ github.ref_name }}

            ### 下载
            - **Windows**：下载 `.msi` 安装包

            ### 更新内容
            请查看 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/changelog/CHANGELOG_AUTO.md)
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

  # ── 已移除：publish-update-manifest job ──────────────────────────────
  # 曾手工生成并上传 latest.json。自 6b9d165 启用 createUpdaterArtifacts 后，
  # tauri-action 已自动产出完整的 latest.json（含 windows-x86_64 / -msi / -nsis
  # 三个平台键与真实签名），该 job 变为冗余。
  #
  # 且它已失效：轮询的资产名是 *.msi.zip / *.msi.zip.sig，而 Tauri 2 不再将
  # MSI 打成 zip，实际产物为 *.msi / *.msi.sig。轮询 30 次 × 20s 后必然报错，
  # 把整个 run 标记为失败 —— 即使发行版本身完全正常，造成误导。
