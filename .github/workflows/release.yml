# .github/workflows/release.yml
# 推送 v* tag 时自动构建 Windows 与 macOS 安装包，发布到 GitHub Releases。
#
# 双平台矩阵构建：Windows (MSI + NSIS) + macOS (dmg)。
#
# latest.json（Tauri Updater 自动更新清单）由 tauri-action 依据 tauri.conf.json 的
# bundle.createUpdaterArtifacts 生成 —— 该开关产出各安装包的 .sig 签名，tauri-action
# 再把它们组装成 latest.json。**关掉它，自动更新会静默失效**：产物仍有 .msi/.dmg，
# 但更新端点会 404（v0.3.0 起就这样坏了，v0.4.1 才修复）。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 最小权限（QT-014）：默认只读；仅真正上传 Release 资产的两个构建 job
# 显式获得 contents: write（tauri-action 创建 Release 并上传安装包与清单）。
# verify-updater-manifest 等其余 job 继承只读 —— 它们不需要任何写权限。
permissions:
  contents: read

jobs:
  # ── Windows 构建 ─────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    name: Build Windows (x86_64)

    # 上传 Release 资产是本仓库唯二需要写权限的 job（QT-014）
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: windows-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-x86_64-cargo-

      - name: Install frontend dependencies
        run: npm ci

      # ── 构建前检查：三处版本号必须一致 ─────────────────────────────────
      - name: Verify version sync
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAURI_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VER=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "package.json: $PKG_VER | tauri.conf.json: $TAURI_VER | Cargo.toml: $CARGO_VER"
          if [ "$PKG_VER" != "$TAURI_VER" ] || [ "$PKG_VER" != "$CARGO_VER" ]; then
            echo "ERROR: Version mismatch — all three files must agree"
            exit 1
          fi
          # 仅在 tag 触发时检查 tag 与版本号一致
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            echo "tag: $TAG_VER"
            if [ "$PKG_VER" != "$TAG_VER" ]; then
              echo "ERROR: Version mismatch — git tag must agree with package versions"
              exit 1
            fi
          fi

      # ── 构建前检查：TypeScript 类型检查 ────────────────────────────────
      - name: TypeScript type check
        run: npx tsc --noEmit

      # ── 构建前检查：Rust lint ───────────────────────────────────────────
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      # ── 依赖安全扫描 ────────────────────────────────────────────────────
      # 依赖审计门禁（QT-014）：高危公告未豁免即失败。豁免清单逐项
      # 带理由，只允许覆盖「构建期传递依赖、不进入发行产物」的已知项；
      # 新增高危公告（或移除豁免）会让本步骤变红 —— 不再被
      # continue-on-error 静默放行。
      - name: npm audit (high severity gate)
        # Windows runner 默认 pwsh：set -euo pipefail 会直接语法报错，
        # 门禁脚本必须显式走 bash（macOS 默认即 bash，此前没暴露）
        shell: bash
        env:
          AUDIT_EXEMPT: >-
            GHSA-c83g-rgw3-j3cx
            GHSA-73wf-gq98-2v4g
            GHSA-2v37-7h3g-55p8
            GHSA-68fv-2mgg-jv7q
            GHSA-xjj6-f33q-929c
            GHSA-587h-7wmj-h5pm
        run: |
          set -euo pipefail
          npm audit --audit-level=high --json > audit-report.json || true
          node -e "
            const report = require('./audit-report.json');
            const exempt = new Set(process.env.AUDIT_EXEMPT.split(/\s+/).filter(Boolean));
            const unhandled = new Set();
            for (const vuln of Object.values(report.vulnerabilities || {})) {
              for (const via of vuln.via || []) {
                if (via.severity !== 'high' || !via.url) continue;
                const id = via.url.split('/').pop();
                if (!exempt.has(id)) unhandled.add(id + ' (' + vuln.name + ')');
              }
            }
            if (unhandled.size > 0) {
              console.error('存在未豁免的高危公告 —— 发布阻断:');
              for (const id of unhandled) console.error('  - ' + id);
              console.error('如需豁免：确认其为构建期依赖且不进入发行产物，');
              console.error('带理由加入 AUDIT_EXEMPT 并安排升级复审。');
              process.exit(1);
            }
            console.log('npm audit 门禁通过（高危公告全部在豁免清单内）');
          "
      # ── 预装 WiX 4（MSI 打包工具）────────────────────────────────────────
      # Tauri bundler 在运行时从 GitHub 下载 WiX，会因网络 504 失败；
      # 提前安装后 bundler 直接使用本地工具链，避免 CI 网络超时。
      - name: Install WiX toolset
        run: dotnet tool install --global wix

      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "QuickTranslate ${{ github.ref_name }}"
          releaseBody: |
            ## QuickTranslate ${{ github.ref_name }}

            ### 下载
            - **Windows**：下载 `.msi` 安装包
            - **macOS**：下载 `.dmg` 安装包（Apple Silicon）

            ### 更新内容
            请查看 [Releases 页面](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}) 了解详细变更。
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

  # ── macOS 构建 ───────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    name: Build macOS (Apple Silicon)

    # 上传 Release 资产是本仓库唯二需要写权限的 job（QT-014）
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: macos-aarch64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-aarch64-cargo-

      - name: Install frontend dependencies
        run: npm ci

      # ── 构建前检查：三处版本号必须一致 ─────────────────────────────────
      - name: Verify version sync
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAURI_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VER=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "package.json: $PKG_VER | tauri.conf.json: $TAURI_VER | Cargo.toml: $CARGO_VER"
          if [ "$PKG_VER" != "$TAURI_VER" ] || [ "$PKG_VER" != "$CARGO_VER" ]; then
            echo "ERROR: Version mismatch — all three files must agree"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            echo "tag: $TAG_VER"
            if [ "$PKG_VER" != "$TAG_VER" ]; then
              echo "ERROR: Version mismatch — git tag must agree with package versions"
              exit 1
            fi
          fi
      # ── 构建前检查：TypeScript 类型检查 ────────────────────────────────
      - name: TypeScript type check
        run: npx tsc --noEmit

      # ── 构建前检查：Rust lint ───────────────────────────────────────────
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin -- -D warnings

      # ── 依赖安全扫描 ────────────────────────────────────────────────────
      # 依赖审计门禁（QT-014）：高危公告未豁免即失败。豁免清单逐项
      # 带理由，只允许覆盖「构建期传递依赖、不进入发行产物」的已知项；
      # 新增高危公告（或移除豁免）会让本步骤变红 —— 不再被
      # continue-on-error 静默放行。
      - name: npm audit (high severity gate)
        # Windows runner 默认 pwsh：set -euo pipefail 会直接语法报错，
        # 门禁脚本必须显式走 bash（macOS 默认即 bash，此前没暴露）
        shell: bash
        env:
          AUDIT_EXEMPT: >-
            GHSA-c83g-rgw3-j3cx
            GHSA-73wf-gq98-2v4g
            GHSA-2v37-7h3g-55p8
            GHSA-68fv-2mgg-jv7q
            GHSA-xjj6-f33q-929c
            GHSA-587h-7wmj-h5pm
        run: |
          set -euo pipefail
          npm audit --audit-level=high --json > audit-report.json || true
          node -e "
            const report = require('./audit-report.json');
            const exempt = new Set(process.env.AUDIT_EXEMPT.split(/\s+/).filter(Boolean));
            const unhandled = new Set();
            for (const vuln of Object.values(report.vulnerabilities || {})) {
              for (const via of vuln.via || []) {
                if (via.severity !== 'high' || !via.url) continue;
                const id = via.url.split('/').pop();
                if (!exempt.has(id)) unhandled.add(id + ' (' + vuln.name + ')');
              }
            }
            if (unhandled.size > 0) {
              console.error('存在未豁免的高危公告 —— 发布阻断:');
              for (const id of unhandled) console.error('  - ' + id);
              console.error('如需豁免：确认其为构建期依赖且不进入发行产物，');
              console.error('带理由加入 AUDIT_EXEMPT 并安排升级复审。');
              process.exit(1);
            }
            console.log('npm audit 门禁通过（高危公告全部在豁免清单内）');
          "

      - name: Build Tauri app (macOS)
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "QuickTranslate ${{ github.ref_name }}"
          releaseBody: |
            ## QuickTranslate ${{ github.ref_name }}

            ### 下载
            - **Windows**：下载 `.msi` 安装包
            - **macOS**：下载 `.dmg` 安装包（Apple Silicon）

            ### 更新内容
            请查看 [Releases 页面](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}) 了解详细变更。
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin

  # ── 更新清单校验 ─────────────────────────────────────────────────────────
  # 两个构建 job 并发向同一 release 上传产物并各自组装 latest.json，最终
  # 内容由后完成的一方决定 —— 若清单缺失某一平台条目，那个平台的自动
  # 更新会指向不存在的文件而静默失效（v0.3.0 事故的同类形态，发布当时
  # 无法察觉）。此 job 在双平台完成后强制核验，缺任一平台即宣告失败。
  verify-updater-manifest:
    name: Verify updater manifest
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    if: github.event_name == 'push'

    steps:
      - name: Validate latest.json covers both platforms
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

          # 等待 release 资产就绪（上传与清单生成有先后）
          for i in $(seq 1 12); do
            if curl -fsSL -o latest.json "$BASE/latest.json" 2>/dev/null; then
              break
            fi
            if [ "$i" = "12" ]; then
              echo "ERROR: latest.json 在发布后仍不可下载"
              exit 1
            fi
            echo "等待 latest.json 就绪（第 $i 次）…"
            sleep 10
          done

          echo "── latest.json ──"
          cat latest.json
          echo ""

          MISSING=0
          # 版本号必须与 tag 一致
          if ! grep -q "\"version\":\"$TAG\"" latest.json && ! grep -q "\"version\": *\"$TAG\"" latest.json; then
            echo "ERROR: latest.json 版本不是 $TAG"
            MISSING=1
          fi
          # 双平台更新条目：直接检查 Tauri updater 的平台键（platforms 对象
          # 的键名以平台标识开头，msi/nsis/app 是其变体后缀）。不能按文件
          # 扩展名匹配 —— nsis 条目的 url 是 -setup.exe 结尾，而 url 值本身
          # 以引号收尾，按扩展名匹配两头都落空（v0.6.0 误报根因）
          if ! grep -q '"windows-x86_64' latest.json; then
            echo "ERROR: latest.json 缺少 Windows 平台更新条目"
            MISSING=1
          fi
          if ! grep -q '"darwin-aarch64' latest.json; then
            echo "ERROR: latest.json 缺少 macOS 平台更新条目"
            MISSING=1
          fi

          if [ "$MISSING" = "1" ]; then
            echo "自动更新清单不完整，请检查 tauri-action 的清单合并行为"
            exit 1
          fi
          echo "OK: latest.json 覆盖 Windows 与 macOS 双平台，版本 $TAG"
